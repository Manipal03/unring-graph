<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- unring-graph mark: an undo arrow on the undone call, with its blast radius
       rippling out as rings. Node colours are reversibility verdicts. -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58A6FF"/>
    </marker>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0E1116"/>
  <g transform="translate(256 262) scale(0.84)">
    <circle r="140" fill="none" stroke="#58A6FF" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="6 10"/>
    <circle r="260" fill="none" stroke="#58A6FF" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="6 10"/>
    <g stroke="#3D4652" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-140"/>
      <line x1="0" y1="0" x2="121" y2="70"/>
      <line x1="0" y1="0" x2="-121" y2="70"/>
      <line x1="0" y1="-140" x2="130" y2="-225"/>
      <line x1="0" y1="-140" x2="-130" y2="-225"/>
      <line x1="121" y1="70" x2="251" y2="67"/>
    </g>
    <path d="M -29 -50.2 A 58 58 0 1 0 29 -50.2" fill="none" stroke="#58A6FF" stroke-width="9" stroke-linecap="round" marker-end="url(#head)"/>
    <circle r="30" fill="#E6EDF3"/>
    <circle cx="0" cy="-140" r="22" fill="#3FB950"/>
    <circle cx="121" cy="70" r="22" fill="#D29922"/>
    <circle cx="-121" cy="70" r="22" fill="#F85149"/>
    <circle cx="130" cy="-225" r="16" fill="#3FB950"/>
    <circle cx="-130" cy="-225" r="16" fill="#3FB950"/>
    <circle cx="251" cy="67" r="15" fill="#0E1116" stroke="#8B949E" stroke-width="4" stroke-dasharray="5 5"/>
  </g>
</svg>
